# pnpm 10/11 lee la configuración específica de pnpm desde aquí (ya no del .npmrc).

# No verificar dependencias antes de cada script (evita que `pnpm db:deploy` /
# `pnpm build` disparen un `pnpm install` que puede fallar en el servidor).
verifyDepsBeforeRun: false

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  mediasoup: true
  prisma: true
  unrs-resolver: true
